name: CI Pipeline


on:

  push:

    branches:
      - main
      - develop


  pull_request:

    branches:
      - main


jobs:


  build:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4

        with:

          java-version: '21'
          distribution: 'temurin'
          cache: maven


      - name: Run tests
        run: ./mvnw test


      - name: Build application
        run: ./mvnw clean package -DskipTests